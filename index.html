    <title>A História do Futebol</title>
    <style>
        /* Estilos Gerais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #1e5631, #4c9a2a);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            margin: 0.5rem 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Seções e Cartões */
        section {
            background: white;
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #1e5631;
            border-bottom: 3px solid #4c9a2a;
            padding-bottom: 0.5rem;
            margin-top: 0;
        }

        /* Linha do Tempo / Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #1e5631;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Destaques e Citações */
        blockquote {
            background: #e8f5e9;
            border-left: 5px solid #4c9a2a;
            margin: 1.5rem 0;
            padding: 1rem;
            font-style: italic;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #222;
            color: white;
            font-size: 0.9rem;
            margin-top: 3rem;
        }
    </style>
</head>

    </header>
